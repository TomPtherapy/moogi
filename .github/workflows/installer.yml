# SPDX-License-Identifier: GPL-3.0-only
# FMini-1: builds the firmware and publishes the web installer (web/make_fmug_installer.py: one page with the package
# inside) on GitHub Pages, at https://ruppert.github.io/fmini-1/.
# Once in the repository's Settings > Pages: Source = GitHub Actions.
name: Installer

on:
  push:
    branches: [main]
    paths: ["firmware/**", "web/**", "tools/**", "assets/**", "build.sh", "docs/emu/**", "docs/fmini-ad*", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow fonttools

      - name: JieLi toolchain and AC79 SDK
        run: |
          tools/get_toolchain.sh
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"

      - name: Build the firmware
        run: ./build.sh

      - name: Make the installer page
        run: |
          VERSION=$(sed -n 's/^#define FMINI_VERSION "v\(.*\)"/\1/p' firmware/src/fmug_app.c)
          mkdir -p _site
          python3 web/make_fmug_installer.py build/felucca.fwsc _site/index.html "$VERSION"
          cp build/felucca.fwsc "_site/fmini-1-$VERSION.fwsc"
          cp docs/fmini-ad.mp4 docs/fmini-ad-poster.jpg _site/
          mkdir -p _site/editor && cp web/editor_fmini.html _site/editor/index.html   # the patch editor (web/test_editor_fmini.py)
          cp -r docs/emu _site/emu                 # the browser emulator (web/emu/build_wasi.sh builds docs/emu)
          echo "FMini-1 v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
